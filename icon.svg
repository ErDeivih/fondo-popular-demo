<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="32" height="32">
  <!--
    Favicon de Fondo Popular: el mismo monograma FP que el logotipo de la cabecera
    (componentes/marca/Logotipo.tsx), sobre la baldosa del acento.

    Es un fichero estatico que el navegador carga fuera de la pagina: no hereda variables CSS, asi que
    lleva como literales los valores de los tokens de acento 700 y tinta 50 (tokens.css). No es un
    componente: aqui no hay tokens que aplicar. Sin guiones dobles en este comentario porque XML no los
    admite dentro de un comentario y el icono dejaria de parsearse.
  -->
  <rect width="28" height="28" rx="7" fill="oklch(0.45 0.105 215)" />
  <g fill="none" stroke="oklch(0.98 0.003 250)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 19.5V8.5h5.5M8 13.5h4" />
    <path d="M16 19.5V8.5h3.1a3.7 3.7 0 0 1 0 7.4H16" />
  </g>
  <circle cx="21.6" cy="19.4" r="1.2" fill="oklch(0.98 0.003 250)" />
</svg>
